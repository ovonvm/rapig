name: pages

# Publishes the user manual (docs/wiki) as GitHub Pages.
# Repository Settings -> Pages must use "GitHub Actions" as the source; the
# configure-pages step enables it on the first run, so no manual click is needed.
on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload manual
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/wiki

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
