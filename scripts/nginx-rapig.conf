# Rapig nginx 反代样例（用户已拍板 nginx 路线）。
# 要点：
#   - 只反代根路径（前端资源是绝对 /assets/...）
#   - 保留 Host 头（CSRF 同源只比 Host）
#   - client_max_body_size + proxy_request_buffering off：大文件分片上传必需
#   - TLS 在此终止；应用启动用 -cookie-secure always
#
# 启用：
#   sudo cp scripts/nginx-rapig.conf /etc/nginx/sites-available/rapig.conf
#   sudo ln -s /etc/nginx/sites-available/rapig.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name rapig.example.com;
    # 内网可先不跳 HTTPS；上证书后取消下一行注释
    # return 301 https://$host$request_uri;

    client_max_body_size 8g;

    location / {
        proxy_pass http://127.0.0.1:50011;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

